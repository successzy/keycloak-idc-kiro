AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Keycloak HA - ALB / ACM / Route53 Stack (04/06)
  ACM cert (DNS-validated) + Public ALB + Target Group (IP mode, stickiness) +
  HTTPS-only listener + Route53 A-alias. Depends on 01-network.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [prod, staging, dev]

  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Default: ZXXXXXXXXXXXXXXXXXXX
    Description: Existing Route53 hosted zone ID for example.com.

  HostedZoneName:
    Type: String
    Default: example.com
    Description: Apex domain of the hosted zone (no trailing dot).

  Subdomain:
    Type: String
    Default: sso
    AllowedPattern: '^[a-z0-9][a-z0-9-]*$'
    Description: Left-most DNS label; final FQDN is Subdomain + HostedZoneName.

  EnableDeletionProtection:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

Resources:

  # ---------- ACM certificate (DNS validation in the provided hosted zone) ----------
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Sub ${Subdomain}.${HostedZoneName}
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Sub ${Subdomain}.${HostedZoneName}
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-kc-cert

  # ---------- Target Group (Fargate tasks, IP mode) ----------
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${Environment}-kc-tg
      VpcId:
        Fn::ImportValue: !Sub ${Environment}-kc-network-VpcId
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      # Keycloak's /health endpoint lives on management port 9000, not on the
      # traffic port. Instead we probe /realms/master/.well-known/openid-configuration
      # on 8080, which is always reachable once Keycloak is serving HTTP.
      HealthCheckPath: /realms/master/.well-known/openid-configuration
      HealthCheckPort: traffic-port
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
        - Key: stickiness.enabled
          Value: 'true'
        - Key: stickiness.type
          Value: lb_cookie
        - Key: stickiness.lb_cookie.duration_seconds
          Value: '3600'
        - Key: load_balancing.algorithm.type
          Value: round_robin
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-kc-tg

  # ---------- Public ALB ----------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${Environment}-kc-alb
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets: !Split
        - ','
        - Fn::ImportValue: !Sub ${Environment}-kc-network-PublicSubnetIds
      SecurityGroups:
        - Fn::ImportValue: !Sub ${Environment}-kc-network-AlbSecurityGroupId
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '120'
        - Key: routing.http2.enabled
          Value: 'true'
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
        - Key: routing.http.xff_header_processing.mode
          Value: append
        - Key: deletion_protection.enabled
          Value: !Ref EnableDeletionProtection
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-kc-alb

  # ---------- HTTPS listener -> Target Group ----------
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref Certificate
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ---------- Route53 A-alias -> ALB ----------
  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub ${Subdomain}.${HostedZoneName}.
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: false

Outputs:

  AlbArn:
    Value: !Ref LoadBalancer
    Export:
      Name: !Sub ${Environment}-kc-alb-AlbArn

  AlbDnsName:
    Description: ALB DNS name (use FQDN below from clients)
    Value: !GetAtt LoadBalancer.DNSName
    Export:
      Name: !Sub ${Environment}-kc-alb-DnsName

  AlbHostedZoneId:
    Value: !GetAtt LoadBalancer.CanonicalHostedZoneID
    Export:
      Name: !Sub ${Environment}-kc-alb-HostedZoneId

  TargetGroupArn:
    Description: Target Group for ECS Service to register to
    Value: !Ref TargetGroup
    Export:
      Name: !Sub ${Environment}-kc-alb-TargetGroupArn

  CertificateArn:
    Value: !Ref Certificate
    Export:
      Name: !Sub ${Environment}-kc-alb-CertificateArn

  Fqdn:
    Description: Public Keycloak URL
    Value: !Sub https://${Subdomain}.${HostedZoneName}
    Export:
      Name: !Sub ${Environment}-kc-alb-Fqdn
